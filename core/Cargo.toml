[package]
name = "agentdeck-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml_edit = "0.22"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
