[package]
name = "agentdeck-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
similar = "2"
thiserror = "2"
toml_edit = "0.22"
walkdir = "2"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[dev-dependencies]
tempfile = "3"
