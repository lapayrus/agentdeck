name: CI

on:
  push:
    branches: [master, "integration/**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install frontend dependencies
        run: npm ci --include=dev
      - name: Frontend tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Frontend build
        run: npm run build
      - name: Core tests
        run: cargo test -p agentdeck-core
      - name: Regenerate TypeScript bindings
        run: cargo test -p agentdeck-core export_bindings
      - name: Check generated types are current
        shell: pwsh
        run: |
          git diff --exit-code -- src/generated
          if (git status --porcelain -- src/generated) {
            Write-Error "src/generated is stale; run npm run types"
            exit 1
          }
      - name: Scan benchmark
        run: cargo test --release -p agentdeck-core --test performance -- --ignored --nocapture
      - name: Tauri type check
        run: cargo check -p agentdeck
